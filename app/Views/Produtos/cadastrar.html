<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Novo Produto</title>
</head>
<body>
    <h1>Cadastrar Produto</h1>

    <form action="/produtos/salvar" method="POST" enctype="multipart/form-data">
        <p>
            <label>Nome:</label><br>
            <input type="text" name="nome" required>
        </p>
        <p>
            <label>Preço Custo:</label><br>
            <input type="number" step="0.01" name="preco_custo" required>
        </p>
        <p>
            <label>Preço Venda:</label><br>
            <input type="number" step="0.01" name="preco_venda" required>
        </p>
        <p>
            <label>Estoque Atual:</label><br>
            <input type="number" name="estoque_atual" required>
        </p>
        <p>
            <label>Estoque Mínimo:</label><br>
            <input type="number" name="estoque_minimo" required>
        </p>
        <p>
            <label>Foto do Produto:</label><br>
            <input type="file" name="imagem" accept="image/*" required>
        </p>
        <button type="submit">Salvar Produto</button>
        <a href="/produtos">Cancelar</a>
    </form>
</body>
</html>
